name: INS-EI Pilot
version: "0.28.79"
slug: ins_ei
description: Local-first energy intelligence pilot collector
url: https://github.com/Mangid/ins-ei
startup: application
boot: auto
init: false
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:lightning-bolt
arch: [aarch64, amd64, armv7]
options:
  log_level: INFO
  interval_seconds: 30
  installation_id: pilot-local
  thermal_topology: BUFFER
  timezone: Europe/Vienna
  mqtt_enabled: false
  mqtt_host: ""
  mqtt_port: 8883
  mqtt_username: ""
  mqtt_password: ""
  mappings: []
schema:
  log_level: list(DEBUG|INFO|WARNING|ERROR)
  interval_seconds: int(5,3600)
  installation_id: str
  thermal_topology: list(DIRECT|BUFFER|COMBINED_STORAGE)
  timezone: str
  mqtt_enabled: bool
  mqtt_host: str?
  mqtt_port: int(1,65535)
  mqtt_username: str?
  mqtt_password: password?
  mappings:
    - component_id: str
      point: str
      entity_id: str
      unit: str?
      role: list(OPTIMIZATION|MONITORING|DIAGNOSTIC)?
      scale: float?
      invert_sign: bool?
      freshness: list(FAST|NORMAL|SLOW|STATE)?
      max_age_seconds: int?
