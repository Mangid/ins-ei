<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>INS-EI</title><style>
:root{color-scheme:light dark;--bg:#f4f6f8;--card:#fff;--text:#202124;--muted:#667085;--border:#d9dee5;--accent:#03a9f4}@media(prefers-color-scheme:dark){:root{--bg:#111418;--card:#1c2127;--text:#e8eaed;--muted:#aab2bd;--border:#343b44}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui}header{background:var(--card);border-bottom:1px solid var(--border);padding:14px 22px;display:flex;align-items:center;gap:18px;position:sticky;top:0;z-index:3}header b{font-size:20px}nav{margin-left:auto;display:flex;gap:8px}.tab{padding:7px 11px;color:var(--muted)}main{max-width:1400px;margin:22px auto;padding:0 18px}.card,.group{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:14px}.card{padding:18px}.head{padding:14px 16px;display:flex;gap:14px;align-items:center;border-bottom:1px solid var(--border)}.headtext{flex:1}.title{font-size:17px;font-weight:700}.componentdesc,.description,.meta{color:var(--muted)}.componentdesc{margin-top:3px}.points{padding:0 16px}.point{display:grid;grid-template-columns:minmax(220px,1.2fr) minmax(260px,2fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}.name{font-weight:600}.description{font-size:13px;margin:3px 0}.meta{font-size:12px}.mapped{color:#2e7d32}.empty{color:var(--muted)}button,input{padding:8px;border:1px solid var(--border);border-radius:7px;background:var(--card);color:var(--text)}button{cursor:pointer}.primary{background:var(--accent);color:white;border-color:var(--accent)}.toggle{display:flex;align-items:center;gap:7px;white-space:nowrap}.instance{padding:10px 16px;background:color-mix(in srgb,var(--accent) 5%,transparent);border-bottom:1px solid var(--border)}dialog{width:min(900px,92vw);max-height:80vh;border:1px solid var(--border);border-radius:12px;background:var(--card);color:var(--text)}.entity{padding:9px;border-bottom:1px solid var(--border);cursor:pointer}#entitySearch{width:100%}
</style></head><body><header><button onclick="history.back()">← Zurück</button><b>⚡ INS-EI</b><nav><span class="tab">Übersicht</span><span class="tab">Mappings</span><span class="tab">Discovery</span><span class="tab">System</span></nav></header><main><section class="card"><h2>Anlagenkomponenten & Datenpunkte</h2><p>Aktiviere die Komponenten, die in dieser Anlage tatsächlich vorhanden sind. Mehrfach vorkommende Bereiche können als Instanzen angelegt werden.</p><button class="primary" onclick="saveAll()">Änderungen speichern</button> <span id="msg"></span></section><div id="groups"></div></main><dialog id="picker"><h3 id="pickerTitle"></h3><input id="entitySearch" placeholder="Home Assistant Sensor suchen…"><div id="entityList"></div><button onclick="picker.close()">Abbrechen</button></dialog><script>
let catalog={},mappings=[],entities=[],cfg={},market={},target=null;const e=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const info={
GRID:['Netzanschluss','Messwerte am Übergabepunkt zum öffentlichen Stromnetz.'],
PV:['Photovoltaik','PV-Erzeugung und zugehörige Energiezähler.'],
BATTERY:['Batteriespeicher','Elektrischer Speicher für Eigenverbrauch, dynamische Tarife und Netzoptimierung.'],
BUFFER:['Pufferspeicher','Thermischer Speicher für Raumheizung und Wärmeerzeuger.'],
COMBINED_STORAGE:['Kombispeicher','Gemeinsamer Speicher für Raumheizung und Warmwasser.'],
DHW:['Warmwasserspeicher','Separater Speicher für Trinkwarmwasser.'],
POWER_TO_HEAT:['Power-to-Heat','Elektrischer Heizstab oder Leistungssteller wie AC-THOR bzw. Ohmpilot.'],
HEAT_PUMP:['Wärmepumpe','Elektrischer Wärmeerzeuger für Heizung und/oder Warmwasser.'],
PELLET_BOILER:['Pelletkessel','Pellet-Wärmeerzeuger einschließlich Verbrauchs- und Betriebsdaten.'],
HEATING_CIRCUIT:['Heizkreise','Mehrere Heizkreise wie Heizkörper oder Fußbodenheizung können separat angelegt werden.'],
ROOM:['Räume / Zonen','Optionale Räume oder Zonen mit Temperatur, Sollwerten und Ventilstellung.'],
LOAD:['Verbraucher','Beliebig viele elektrische Einzelverbraucher oder Verbrauchergruppen.']
};
const multi=['HEATING_CIRCUIT','ROOM','LOAD'];const defaultOn=['GRID','PV'];
async function init(){catalog=await(await fetch('api/catalog')).json();mappings=await(await fetch('api/mappings')).json();entities=await(await fetch('api/entities')).json();cfg=await(await fetch('api/components')).json();market=await(await fetch('api/market')).json();for(const c of catalog.components){if(!cfg[c])cfg[c]={enabled:defaultOn.includes(c)||mappings.some(x=>base(x.component_id)===c),instances:[]};if(multi.includes(c)&&!cfg[c].instances.length){let ids=[...new Set(mappings.filter(x=>base(x.component_id)===c).map(x=>x.component_id))];cfg[c].instances=ids.map((id,i)=>({id,name:prettyInstance(c,i+1)}));}}e('entitySearch').addEventListener('input',renderPicker);render()}
function base(id){let u=(id||'').toUpperCase();for(const c of catalog.components)if(u===c||u.startsWith(c+'_')||u.startsWith(c+':'))return c;return u}
function prettyInstance(c,n){return c==='HEATING_CIRCUIT'?'Heizkreis '+n:c==='ROOM'?'Raum '+n:'Verbraucher '+n}
function render(){e('groups').innerHTML=catalog.components.map(c=>c==='MARKET'?marketGroup():group(c)).join('')}
function marketGroup(){
 const mode=market.mode||'AWATTAR_AT';
 let fields='';
 if(mode==='AWATTAR_AT')fields='<div class="points"><div class="description">aWATTar Österreich: Spotpreis plus Bezug-Aufschlag und USt.; Einspeisung als Anteil des Spotpreises.</div><label>Bezug-Aufschlag ct/kWh <input type="number" step="0.001" value="'+(market.import_markup_ct??1.5)+'" onchange="market.import_markup_ct=Number(this.value)"></label> <label>USt. % <input type="number" step="0.1" value="'+(market.vat_percent??20)+'" onchange="market.vat_percent=Number(this.value)"></label> <label>Einspeisefaktor % <input type="number" step="0.1" value="'+(market.export_factor_percent??81)+'" onchange="market.export_factor_percent=Number(this.value)"></label></div>';
 else if(mode==='STATIC')fields='<div class="points"><div class="description">Feste Preise ohne dynamischen Spotmarkt.</div><label>Bezug ct/kWh <input type="number" step="0.01" value="'+(market.static_import_ct??25)+'" onchange="market.static_import_ct=Number(this.value)"></label> <label>Einspeisung ct/kWh <input type="number" step="0.01" value="'+(market.static_export_ct??8)+'" onchange="market.static_export_ct=Number(this.value)"></label></div>';
 else fields='<div class="points"><div class="description">Preise werden über Home-Assistant-Sensoren gemappt.</div>'+catalog.points.MARKET.map(p=>pointRow('MARKET','MARKET',p)).join('')+'</div>';
 return '<section class="group"><div class="head"><div class="headtext"><div class="title">Stromtarif / Marktdaten</div><div class="componentdesc">Tarifmodell für wirtschaftliche Entscheidungen von INS-EI.</div></div><select onchange="market.mode=this.value;render()"><option value="AWATTAR_AT" '+(mode==='AWATTAR_AT'?'selected':'')+'>aWATTar Österreich</option><option value="DYNAMIC_OTHER" '+(mode==='DYNAMIC_OTHER'?'selected':'')+'>Anderer dynamischer Anbieter</option><option value="STATIC" '+(mode==='STATIC'?'selected':'')+'>Statischer Tarif</option><option value="HA_SENSORS" '+(mode==='HA_SENSORS'?'selected':'')+'>Manuell über HA-Sensoren</option></select></div>'+fields+'</section>'
}
function group(c){let i=info[c]||[c,''];let active=cfg[c].enabled;let controls=multi.includes(c)?'<button onclick="addInstance(\''+c+'\')">+ '+esc(i[0])+' hinzufügen</button>':'<label class="toggle"><input type="checkbox" '+(active?'checked':'')+' onchange="toggleComponent(\''+c+'\',this.checked)"> vorhanden</label>';let body='';if(active){if(multi.includes(c))body=cfg[c].instances.map(inst=>instanceBlock(c,inst)).join('');else body='<div class="points">'+catalog.points[c].map(p=>pointRow(c,c,p)).join('')+'</div>'}return '<section class="group"><div class="head"><div class="headtext"><div class="title">'+esc(i[0])+'</div><div class="componentdesc">'+esc(i[1])+'</div></div>'+controls+'</div>'+body+'</section>'}
function instanceBlock(c,inst){return '<div class="instance"><b>'+esc(inst.name)+'</b> <button onclick="renameInstance(\''+c+'\',\''+inst.id+'\')">Umbenennen</button> <button onclick="removeInstance(\''+c+'\',\''+inst.id+'\')">Entfernen</button></div><div class="points">'+catalog.points[c].map(p=>pointRow(c,inst.id,p)).join('')+'</div>'}
function mappingFor(id,p){
  const component=base(id);
  if(multi.includes(component))return mappings.find(x=>x.component_id===id&&x.point===p);
  return mappings.find(x=>base(x.component_id)===component&&x.point===p);
}
function pointRow(c,id,p){let m=mappingFor(id,p),meta=catalog.meta[c][p],value=m?m.entity_id:'— nicht zugeordnet —';return '<div class="point"><div><div class="name">'+esc(p)+'</div><div class="description">'+esc(meta.description||'')+'</div><div class="meta">'+esc(meta.unit||'ohne Einheit')+' · '+esc(meta.role)+' · '+esc(meta.freshness)+'</div></div><div class="'+(m?'mapped':'empty')+'">'+esc(value)+'</div><div><button onclick="pick(\''+c+'\',\''+id+'\',\''+p+'\')">Sensor wählen</button>'+(m?'<button onclick="clearMap(\''+id+'\',\''+p+'\')">×</button>':'')+'</div></div>'}
function toggleComponent(c,on){cfg[c].enabled=on;if(!on)mappings=mappings.filter(x=>base(x.component_id)!==c);render()}
function addInstance(c){cfg[c].enabled=true;let n=1,id;do{id=c.toLowerCase()+'_'+n++}while(cfg[c].instances.some(x=>x.id===id));cfg[c].instances.push({id,name:prettyInstance(c,cfg[c].instances.length+1)});render()}
function renameInstance(c,id){let x=cfg[c].instances.find(x=>x.id===id),v=prompt('Name',x.name);if(v)x.name=v;render()}
function removeInstance(c,id){if(!confirm('Instanz und ihre Mappings entfernen?'))return;cfg[c].instances=cfg[c].instances.filter(x=>x.id!==id);mappings=mappings.filter(x=>x.component_id!==id);render()}
function pick(c,id,p){target={c,id,p};e('pickerTitle').textContent=(info[c]?.[0]||c)+' → '+p;e('entitySearch').value='';renderPicker();e('picker').showModal()}
function candidates(){let q=e('entitySearch').value.toLowerCase(),meta=catalog.meta[target.c][target.p];return entities.filter(x=>{let t=((x.entity_id||'')+' '+(x.name||'')).toLowerCase();if(q&&!t.includes(q))return false;if(meta.unit&&x.unit&&meta.unit!==x.unit&&!(meta.unit==='W'&&x.unit==='kW'))return false;return true}).sort((a,b)=>((a.suggested_domain===target.c&&a.suggested_point===target.p)?0:1)-((b.suggested_domain===target.c&&b.suggested_point===target.p)?0:1))}
function renderPicker(){if(!target)return;e('entityList').innerHTML=candidates().slice(0,250).map(x=>'<div class="entity" onclick="choose(\''+esc(x.entity_id)+'\')"><b>'+esc(x.entity_id)+'</b><div class="meta">'+esc(x.name||'')+' · '+esc(x.state)+' '+esc(x.unit||'')+'</div></div>').join('')}
function choose(entity){let old=mappingFor(target.id,target.p),used=mappings.find(x=>x.entity_id===entity&&x!==old);if(used){alert('Sensor bereits '+used.component_id+'.'+used.point+' zugeordnet.');return}if(old)old.entity_id=entity;else mappings.push({component_id:target.id,point:target.p,entity_id:entity});e('picker').close();render()}
function clearMap(id,p){
  const component=base(id);
  mappings=mappings.filter(x=>multi.includes(component)?!(x.component_id===id&&x.point===p):!(base(x.component_id)===component&&x.point===p));
  render()
}
async function saveAll(){let a=await fetch('api/mappings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({rows:mappings})});let aj=await a.json();if(!a.ok){e('msg').textContent=(aj.errors||['Fehler']).join('; ');return}await fetch('api/components',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(cfg)});await fetch('api/market',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(market)});e('msg').textContent=' Gespeichert: '+aj.saved+' Mappings'}
init();
</script></body></html>
