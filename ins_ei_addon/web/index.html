<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>INS-EI</title><style>
:root{color-scheme:light dark;--bg:#f4f6f8;--card:#fff;--text:#202124;--muted:#667085;--border:#d9dee5;--accent:#03a9f4}@media(prefers-color-scheme:dark){:root{--bg:#111418;--card:#1c2127;--text:#e8eaed;--muted:#aab2bd;--border:#343b44}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui}header{background:var(--card);border-bottom:1px solid var(--border);padding:14px 22px;display:flex;align-items:center;gap:18px;position:sticky;top:0;z-index:3}header b{font-size:20px}nav{margin-left:auto;display:flex;gap:8px}.tab{padding:7px 11px;color:var(--muted)}main{max-width:1400px;margin:22px auto;padding:0 18px}.card,.group{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:14px}.card{padding:18px}.head{padding:14px 16px;display:flex;gap:14px;align-items:center;border-bottom:1px solid var(--border)}.headtext{flex:1}.title{font-size:17px;font-weight:700}.componentdesc,.description,.meta{color:var(--muted)}.componentdesc{margin-top:3px}.points{padding:0 16px}.point{display:grid;grid-template-columns:minmax(220px,1.2fr) minmax(260px,2fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}.name{font-weight:600}.description{font-size:13px;margin:3px 0}.meta{font-size:12px}.mapped{color:#2e7d32}.empty{color:var(--muted)}button,input{padding:8px;border:1px solid var(--border);border-radius:7px;background:var(--card);color:var(--text)}button{cursor:pointer}.primary{background:var(--accent);color:white;border-color:var(--accent)}.toggle{display:flex;align-items:center;gap:7px;white-space:nowrap}.instance{padding:10px 16px;background:color-mix(in srgb,var(--accent) 5%,transparent);border-bottom:1px solid var(--border)}dialog{width:min(900px,92vw);max-height:80vh;border:1px solid var(--border);border-radius:12px;background:var(--card);color:var(--text)}.entity{padding:9px;border-bottom:1px solid var(--border);cursor:pointer}#entitySearch{width:100%}.mapping-tools{display:grid;grid-template-columns:2fr 1fr auto;gap:10px;align-items:center;margin-top:14px}.mapping-tools input,.mapping-tools select{width:100%}.theme{margin:18px 0}.theme-header{display:flex;align-items:center;gap:8px;cursor:pointer;padding:4px}.theme-title{font-size:19px;font-weight:700}.theme-desc{color:var(--muted);font-size:13px;margin:0 4px 10px}.collapse{font-size:15px;width:22px}.head{cursor:pointer}.head .toggle,.head button,.head select{cursor:auto}.count{color:var(--muted);white-space:nowrap}@media(max-width:800px){.mapping-tools{grid-template-columns:1fr}.point{grid-template-columns:1fr}}
</style></head><body><header><button onclick="history.back()">← Zurück</button><b>⚡ INS-EI</b><nav><span class="tab">Übersicht</span><span class="tab">Mappings</span><span class="tab">Discovery</span><span class="tab">System</span></nav></header><main><section class="card"><h2>Anlagenkomponenten & Datenpunkte</h2><p>Aktiviere die Komponenten, die in dieser Anlage tatsächlich vorhanden sind. Mehrfach vorkommende Bereiche können als Instanzen angelegt werden.</p><button class="primary" onclick="saveAll()">Änderungen speichern</button> <span id="msg"></span><div class="mapping-tools"><input id="mapSearch" placeholder="Datenpunkt, Beschreibung oder HA-Entity suchen…"><select id="mapFilter"><option value="ALL">Alle Datenpunkte</option><option value="MAPPED">Nur zugeordnet</option><option value="UNMAPPED">Nur nicht zugeordnet</option></select><span id="mapCount" class="count"></span></div></section><div id="groups"></div></main><dialog id="picker"><h3 id="pickerTitle"></h3><input id="entitySearch" placeholder="Home Assistant Sensor suchen…"><div id="entityList"></div><button onclick="picker.close()">Abbrechen</button></dialog><script>
let catalog={},mappings=[],entities=[],cfg={},market={},target=null;
const defaultCollapsed={'theme:STROM':true,'theme:WAERME':true,'theme:MARKT':true,'theme:NUTZUNG':true};
let storedCollapsed=JSON.parse(localStorage.getItem('ins_ei_collapsed')||'{}');
let collapsed=Object.keys(storedCollapsed).length?storedCollapsed:{...defaultCollapsed};const e=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const info={
GRID:['Netzanschluss','Messwerte am Übergabepunkt zum öffentlichen Stromnetz.'],
PV:['Photovoltaik','PV-Erzeugung und zugehörige Energiezähler.'],
BATTERY:['Batteriespeicher','Elektrischer Speicher für Eigenverbrauch, dynamische Tarife und Netzoptimierung.'],
BUFFER:['Pufferspeicher','Thermischer Speicher für Raumheizung und Wärmeerzeuger.'],
COMBINED_STORAGE:['Kombispeicher','Gemeinsamer Speicher für Raumheizung und Warmwasser.'],
DHW:['Warmwasserspeicher','Separater Speicher für Trinkwarmwasser.'],
POWER_TO_HEAT:['Power-to-Heat','Elektrischer Heizstab oder Leistungssteller wie AC-THOR bzw. Ohmpilot.'],
HEAT_PUMP:['Wärmepumpe','Elektrischer Wärmeerzeuger für Heizung und/oder Warmwasser.'],
PELLET_BOILER:['Pelletkessel','Pellet-Wärmeerzeuger einschließlich Verbrauchs- und Betriebsdaten.'],
HEATING_CIRCUIT:['Heizkreise','Mehrere Heizkreise wie Heizkörper oder Fußbodenheizung können separat angelegt werden.'],
ROOM:['Räume / Zonen','Optionale Räume oder Zonen mit Temperatur, Sollwerten und Ventilstellung.'],
LOAD:['Verbraucher','Beliebig viele elektrische Einzelverbraucher oder Verbrauchergruppen.']
};
const multi=['HEATING_CIRCUIT','ROOM','LOAD'];const defaultOn=['GRID','PV'];
async function init(){
 try{
  const responses=await Promise.all([fetch('api/catalog'),fetch('api/mappings'),fetch('api/entities'),fetch('api/components'),fetch('api/market')]);
  for(const response of responses){if(!response.ok)throw new Error('API '+response.status)}
  catalog=await responses[0].json();mappings=await responses[1].json();entities=await responses[2].json();cfg=await responses[3].json();market=await responses[4].json();
  if(!market.import&&!market.export){
   const old=market;
   market={import:{mode:old.mode==='STATIC'?'STATIC':old.mode==='HA_SENSORS'?'HA_SENSOR':'DYNAMIC',provider:'AWATTAR_AT',markup_ct:old.import_markup_ct??1.5,adjust_percent:0,vat_percent:old.vat_percent??20,static_ct:old.static_import_ct??25},export:{mode:old.mode==='STATIC'?'STATIC':old.mode==='HA_SENSORS'?'HA_SENSOR':'DYNAMIC',provider:'SPOT_AT',markup_ct:0,adjust_percent:(old.export_factor_percent??81)-100,vat_percent:0,static_ct:old.static_export_ct??8}};
  }
  for(const c of catalog.components){
   if(c==='MARKET')continue;
   if(!cfg[c])cfg[c]={enabled:defaultOn.includes(c)||mappings.some(x=>base(x.component_id)===c),instances:[]};
   if(multi.includes(c)&&!cfg[c].instances.length){let ids=[...new Set(mappings.filter(x=>base(x.component_id)===c).map(x=>x.component_id))];cfg[c].instances=ids.map((id,i)=>({id,name:prettyInstance(c,i+1)}));}
  }
  e('entitySearch').addEventListener('input',renderPicker);e('mapSearch').addEventListener('input',render);e('mapFilter').addEventListener('change',render);render();
 }catch(err){e('groups').innerHTML='<section class="card"><b>Fehler beim Laden der Mapping-Daten:</b> '+esc(err.message)+'</section>';console.error(err)}
}
function base(id){let u=(id||'').toUpperCase();for(const c of catalog.components)if(u===c||u.startsWith(c+'_')||u.startsWith(c+':'))return c;return u}
function prettyInstance(c,n){return c==='HEATING_CIRCUIT'?'Heizkreis '+n:c==='ROOM'?'Raum '+n:'Verbraucher '+n}
function visiblePoint(c,id,p){
 const q=(e('mapSearch')?.value||'').toLowerCase().trim(),filter=e('mapFilter')?.value||'ALL',m=mappingFor(id,p),meta=(catalog.meta[c]||{})[p]||{},i=info[c]||[c,''];
 if(filter==='MAPPED'&&!m)return false;if(filter==='UNMAPPED'&&m)return false;
 if(!q)return true;
 return (c+' '+i[0]+' '+p+' '+(meta.description||'')+' '+(m?.entity_id||'')).toLowerCase().includes(q)
}
function componentHasVisible(c){
 if(c==='MARKET')return true;
 if(multi.includes(c)){let inst=cfg[c]?.instances||[];return inst.some(x=>(catalog.points[c]||[]).some(p=>visiblePoint(c,x.id,p)))}
 return (catalog.points[c]||[]).some(p=>visiblePoint(c,c,p))
}
function render(){
 const themes=[
  ['STROM','Strom','Netz, Photovoltaik und Batteriespeicher',['GRID','PV','BATTERY']],
  ['WAERME','Wärme','Speicher, Wärmeerzeuger und Heizkreise',['BUFFER','COMBINED_STORAGE','DHW','PELLET_BOILER','HEAT_PUMP','POWER_TO_HEAT','HEATING_CIRCUIT']],
  ['MARKT','Tarife & Prognosen','Stromtarife, Marktdaten und Energieprognosen',['MARKET','FORECAST']],
  ['NUTZUNG','Räume & Verbraucher','Optionale Zonen und einzelne Verbraucher',['ROOM','LOAD']]
 ];
 let shown=0,total=0;for(const c of catalog.components){if(c==='MARKET')continue;if(multi.includes(c)){for(const x of (cfg[c]?.instances||[]))for(const p of (catalog.points[c]||[])){total++;if(visiblePoint(c,x.id,p))shown++}}else for(const p of (catalog.points[c]||[])){total++;if(visiblePoint(c,c,p))shown++}}
 e('mapCount').textContent=shown+' von '+total+' Datenpunkten';
 e('groups').innerHTML=themes.map(t=>{let body=t[3].filter(c=>catalog.components.includes(c)&&componentHasVisible(c)).map(c=>c==='MARKET'?marketGroup():group(c)).join('');let closed=!!collapsed['theme:'+t[0]];return body?'<section class="theme"><div class="theme-header" onclick="toggleCollapse(\'theme:'+t[0]+'\')"><span class="collapse">'+(closed?'▸':'▾')+'</span><div class="theme-title">'+t[1]+'</div></div><div class="theme-desc">'+t[2]+'</div><div '+(closed?'hidden':'')+'>'+body+'</div></section>':''}).join('')
}
function toggleCollapse(key){collapsed[key]=!collapsed[key];localStorage.setItem('ins_ei_collapsed',JSON.stringify(collapsed));render()}
function stopClick(ev){ev.stopPropagation()}
function marketGroup(){
 const imp=market.import||{mode:'DYNAMIC',provider:'AWATTAR_AT',markup_ct:1.5,adjust_percent:0,vat_percent:20,static_ct:25};
 const exp=market.export||{mode:'DYNAMIC',provider:'SPOT_AT',markup_ct:0,adjust_percent:-19,vat_percent:0,static_ct:8};
 market.import=imp;market.export=exp;
 const modeOptions=(x)=>'<option value="DYNAMIC" '+(x.mode==='DYNAMIC'?'selected':'')+'>Dynamisch / Spot</option><option value="STATIC" '+(x.mode==='STATIC'?'selected':'')+'>Statisch</option><option value="HA_SENSOR" '+(x.mode==='HA_SENSOR'?'selected':'')+'>HA-Sensor</option>';
 const dynamicFields=(x,key)=>'<label>Anbieter / Preisquelle <select onchange="market.'+key+'.provider=this.value"><option value="AWATTAR_AT" '+(x.provider==='AWATTAR_AT'?'selected':'')+'>aWATTar / EPEX Spot AT</option><option value="SPOT_AT" '+(x.provider==='SPOT_AT'?'selected':'')+'>EPEX Spot AT</option><option value="OTHER" '+(x.provider==='OTHER'?'selected':'')+'>Andere dynamische Quelle</option></select></label> <label>Aufschlag / Abzug ct/kWh <input type="number" step="0.001" value="'+(x.markup_ct??0)+'" onchange="market.'+key+'.markup_ct=Number(this.value)"></label> <label>Aufschlag / Abzug % <input type="number" step="0.1" value="'+(x.adjust_percent??0)+'" onchange="market.'+key+'.adjust_percent=Number(this.value)"></label> <label>USt. % <input type="number" step="0.1" value="'+(x.vat_percent??0)+'" onchange="market.'+key+'.vat_percent=Number(this.value)"></label>';
 const spotMapping=()=>'<div style="padding:14px 16px;border-bottom:1px solid var(--border)"><div class="name">Spotpreisquelle</div><div class="description">Für die Optimierung brauchen wir neben dem aktuellen Preis auch die kommenden Preis-Slots. Aktuell ist der HA-Sensor für den Momentanpreis zugeordnet; die Zeitreihe wird im nächsten Schritt aus dessen Attributen bzw. einer Preis-Entity gelesen.</div>'+pointRow('MARKET','MARKET','spot_price')+'</div>';
 const side=(title,x,key,point)=>'<div style="padding:14px 16px;border-bottom:1px solid var(--border)"><div class="name">'+title+'</div><div class="description">Tarifart unabhängig von der anderen Energierichtung konfigurieren.</div><label>Tarifart <select onchange="market.'+key+'.mode=this.value;render()">'+modeOptions(x)+'</select></label> '+(x.mode==='DYNAMIC'?dynamicFields(x,key):x.mode==='STATIC'?'<label>Preis ct/kWh <input type="number" step="0.01" value="'+(x.static_ct??0)+'" onchange="market.'+key+'.static_ct=Number(this.value)"></label>':'<div class="description">Preis wird über '+point+' aus Home Assistant übernommen.</div>'+pointRow('MARKET','MARKET',point))+'</div>';
 return '<section class="group"><div class="head"><div class="headtext"><div class="title">Stromtarif / Marktdaten</div><div class="componentdesc">Bezug und Einspeisung werden getrennt konfiguriert und können statisch oder dynamisch kombiniert werden.</div></div></div>'+((imp.mode==='DYNAMIC'||exp.mode==='DYNAMIC')?spotMapping():'')+side('Bezugstarif',imp,'import','import_price')+side('Einspeisetarif',exp,'export','export_price')+'</section>'
}
function group(c){
 let i=info[c]||[c,''],active=cfg[c].enabled,closed=!!collapsed['component:'+c];
 let controls=multi.includes(c)?'<button onclick="stopClick(event);addInstance(\''+c+'\')">+ '+esc(i[0])+' hinzufügen</button>':'<label class="toggle" onclick="stopClick(event)"><input type="checkbox" '+(active?'checked':'')+' onchange="toggleComponent(\''+c+'\',this.checked)"> vorhanden</label>';
 let body='';
 if(active){if(multi.includes(c))body=cfg[c].instances.map(inst=>instanceBlock(c,inst)).join('');else body='<div class="points">'+catalog.points[c].filter(p=>visiblePoint(c,c,p)).map(p=>pointRow(c,c,p)).join('')+'</div>'}
 return '<section class="group"><div class="head" onclick="toggleCollapse(\'component:'+c+'\')"><span class="collapse">'+(closed?'▸':'▾')+'</span><div class="headtext"><div class="title">'+esc(i[0])+'</div><div class="componentdesc">'+esc(i[1])+'</div></div>'+controls+'</div><div '+(closed?'hidden':'')+'>'+body+'</div></section>'
}
function instanceBlock(c,inst){let pts=catalog.points[c].filter(p=>visiblePoint(c,inst.id,p));if(!pts.length)return '';return '<div class="instance"><b>'+esc(inst.name)+'</b> <button onclick="renameInstance(\''+c+'\',\''+inst.id+'\')">Umbenennen</button> <button onclick="removeInstance(\''+c+'\',\''+inst.id+'\')">Entfernen</button></div><div class="points">'+catalog.points[c].map(p=>pointRow(c,inst.id,p)).join('')+'</div>'}
function mappingFor(id,p){
  const component=base(id);
  if(multi.includes(component))return mappings.find(x=>x.component_id===id&&x.point===p);
  return mappings.find(x=>base(x.component_id)===component&&x.point===p);
}
function pointRow(c,id,p){let m=mappingFor(id,p),meta=catalog.meta[c][p],value=m?m.entity_id:'— nicht zugeordnet —';return '<div class="point"><div><div class="name">'+esc(p)+'</div><div class="description">'+esc(meta.description||'')+'</div><div class="meta">'+esc(meta.unit||'ohne Einheit')+' · '+esc(meta.role)+' · '+esc(meta.freshness)+'</div></div><div class="'+(m?'mapped':'empty')+'">'+esc(value)+'</div><div><button onclick="pick(\''+c+'\',\''+id+'\',\''+p+'\')">Sensor wählen</button>'+(m?'<button onclick="clearMap(\''+id+'\',\''+p+'\')">×</button>':'')+'</div></div>'}
function toggleComponent(c,on){cfg[c].enabled=on;if(!on)mappings=mappings.filter(x=>base(x.component_id)!==c);render()}
function addInstance(c){cfg[c].enabled=true;let n=1,id;do{id=c.toLowerCase()+'_'+n++}while(cfg[c].instances.some(x=>x.id===id));cfg[c].instances.push({id,name:prettyInstance(c,cfg[c].instances.length+1)});render()}
function renameInstance(c,id){let x=cfg[c].instances.find(x=>x.id===id),v=prompt('Name',x.name);if(v)x.name=v;render()}
function removeInstance(c,id){if(!confirm('Instanz und ihre Mappings entfernen?'))return;cfg[c].instances=cfg[c].instances.filter(x=>x.id!==id);mappings=mappings.filter(x=>x.component_id!==id);render()}
function pick(c,id,p){target={c,id,p};e('pickerTitle').textContent=(info[c]?.[0]||c)+' → '+p;e('entitySearch').value='';renderPicker();e('picker').showModal()}
function candidates(){let q=e('entitySearch').value.toLowerCase(),meta=catalog.meta[target.c][target.p];return entities.filter(x=>{let t=((x.entity_id||'')+' '+(x.name||'')).toLowerCase();if(q&&!t.includes(q))return false;if(meta.unit&&x.unit&&meta.unit!==x.unit&&!(meta.unit==='W'&&x.unit==='kW'))return false;return true}).sort((a,b)=>((a.suggested_domain===target.c&&a.suggested_point===target.p)?0:1)-((b.suggested_domain===target.c&&b.suggested_point===target.p)?0:1))}
function renderPicker(){if(!target)return;e('entityList').innerHTML=candidates().slice(0,250).map(x=>'<div class="entity" onclick="choose(\''+esc(x.entity_id)+'\')"><b>'+esc(x.entity_id)+'</b><div class="meta">'+esc(x.name||'')+' · '+esc(x.state)+' '+esc(x.unit||'')+'</div></div>').join('')}
function choose(entity){let old=mappingFor(target.id,target.p),used=mappings.find(x=>x.entity_id===entity&&x!==old);if(used){alert('Sensor bereits '+used.component_id+'.'+used.point+' zugeordnet.');return}if(old)old.entity_id=entity;else mappings.push({component_id:target.id,point:target.p,entity_id:entity});e('picker').close();render()}
function clearMap(id,p){
  const component=base(id);
  mappings=mappings.filter(x=>multi.includes(component)?!(x.component_id===id&&x.point===p):!(base(x.component_id)===component&&x.point===p));
  render()
}
async function saveAll(){let a=await fetch('api/mappings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({rows:mappings})});let aj=await a.json();if(!a.ok){e('msg').textContent=(aj.errors||['Fehler']).join('; ');return}await fetch('api/components',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(cfg)});await fetch('api/market',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(market)});e('msg').textContent=' Gespeichert: '+aj.saved+' Mappings'}
init();
</script></body></html>
