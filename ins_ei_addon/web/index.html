<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>INS-EI</title><style>
:root{color-scheme:light dark;--bg:#f4f6f8;--card:#fff;--text:#202124;--muted:#667085;--border:#d9dee5;--accent:#03a9f4}@media(prefers-color-scheme:dark){:root{--bg:#111418;--card:#1c2127;--text:#e8eaed;--muted:#aab2bd;--border:#343b44}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui}header{background:var(--card);border-bottom:1px solid var(--border);padding:14px 22px;display:flex;gap:18px;align-items:center}header b{font-size:20px}nav{margin-left:auto;display:flex;gap:8px}nav span{padding:7px 11px;cursor:pointer;color:var(--muted)}nav .active{color:var(--accent)}main{max-width:1350px;margin:22px auto;padding:0 18px}section{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:18px}textarea{width:100%;min-height:130px}button,select,input,textarea{padding:8px;border:1px solid var(--border);border-radius:7px;background:var(--card);color:var(--text)}button{cursor:pointer;margin:6px}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid var(--border);text-align:left}.badge{font-size:11px;padding:3px 7px;border-radius:10px;background:color-mix(in srgb,var(--accent) 15%,transparent)}.candidate{padding:10px;border-bottom:1px solid var(--border)}.muted{color:var(--muted)}
</style></head><body>
<header><button onclick="history.back()">← Zurück</button><b>⚡ INS-EI</b><nav><span>Übersicht</span><span id="mapTab" class="active" onclick="show('map')">Mappings</span><span id="discTab" onclick="show('disc')">Discovery</span><span>System</span></nav></header>
<main><div id="map"><section><h2>Massenimport</h2><textarea id="bulk" placeholder="battery|soc|sensor.battery_soc"></textarea><button onclick="bulkImport()">Importieren</button><i id="msg"></i></section><section><h2>Mappings</h2><button onclick="add()">+ Mapping hinzufügen</button><table><thead><tr><th>Komponente</th><th>Datenpunkt</th><th>HA Entity</th><th></th></tr></thead><tbody id="mappingRows"></tbody></table><button onclick="saveMappings()">Änderungen speichern</button></section></div>
<div id="disc" hidden><section><h2>Discovery</h2><p>Gefundene Home-Assistant-Entities mit INS-EI-Vorschlägen.</p><div id="discoveryRows"></div></section></div></main><script>
let catalog={},mappings=[],discovery=[];const q=id=>document.getElementById(id);async function init(){catalog=await(await fetch('api/catalog')).json();mappings=await(await fetch('api/mappings')).json();discovery=await(await fetch('api/discovery')).json();renderMappings();renderDiscovery()}function options(a,s){return a.map(x=>'<option '+(x===s?'selected':'')+'>'+x+'</option>').join('')}function renderMappings(){q('mappingRows').innerHTML=mappings.map((x,i)=>{let c=(x.component_id||'').toUpperCase();return '<tr><td><select onchange="changeComponent('+i+',this.value)">'+options(catalog.components,c)+'</select></td><td><select onchange="mappings['+i+'].point=this.value">'+options(catalog.points[c]||[],x.point)+'</select></td><td><input value="'+x.entity_id+'" onchange="mappings['+i+'].entity_id=this.value"></td><td><button onclick="mappings.splice('+i+',1);renderMappings()">Löschen</button></td></tr>'}).join('')}function add(){let c=catalog.components[0];mappings.push({component_id:c,point:catalog.points[c][0],entity_id:''});renderMappings()}function changeComponent(i,c){mappings[i].component_id=c;mappings[i].point=catalog.points[c][0];renderMappings()}async function saveMappings(){let r=await fetch('api/mappings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({rows:mappings})});let j=await r.json();q('msg').textContent=r.ok?'Gespeichert: '+j.saved:(j.errors||[]).join('; ')}async function bulkImport(){let r=await fetch('api/import',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:q('bulk').value})});let j=await r.json();if(r.ok){mappings=j.rows;q('bulk').value='';q('msg').textContent='Importiert: '+j.added+', übersprungen: '+j.skipped;renderMappings()}else q('msg').textContent=(j.errors||[]).join('; ')}function renderDiscovery(){q('discoveryRows').innerHTML=discovery.slice(0,200).map((x,i)=>'<div class="candidate"><b>'+x.entity_id+'</b> <span class="badge">'+(x.mapped_to?'MAPPED '+x.mapped_to:'CANDIDATE')+'</span><div class="muted">'+(x.name||'')+' · '+(x.state??'')+' '+(x.unit||'')+' · '+(x.suggested_domain||'?')+' / '+(x.suggested_point||'?')+'</div>'+(!x.mapped_to&&x.suggested_point?'<button onclick="accept('+i+')">Übernehmen</button>':'')+'</div>').join('')}async function accept(i){let r=await fetch('api/discovery/accept',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({item:discovery[i]})});if(r.ok){mappings=(await r.json()).rows;discovery[i].mapped_to=discovery[i].suggested_domain+'.'+discovery[i].suggested_point;renderMappings();renderDiscovery()}}function show(p){q('map').hidden=p!=='map';q('disc').hidden=p!=='disc';q('mapTab').classList.toggle('active',p==='map');q('discTab').classList.toggle('active',p==='disc')}init();
</script></body></html>
