services:
  ins-ei-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ins-ei-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8100:8100"
    volumes:
      - ins_ei_data:/data
      - ./secrets/pushsafer_private_key:/run/secrets/pushsafer_private_key:ro
      - ./secrets/management_api_key:/run/secrets/management_api_key:ro
      - ./secrets/oekofen_username:/run/secrets/oekofen_username:ro
      - ./secrets/oekofen_password:/run/secrets/oekofen_password:ro
      - ./secrets/oekofen_client_secret:/run/secrets/oekofen_client_secret:ro
      - ./secrets/influxdb_token:/run/secrets/influxdb_token:ro
      - ./secrets/vapid_private_key:/run/secrets/vapid_private_key:ro
      - ./secrets/vapid_public_key:/run/secrets/vapid_public_key:ro
      - ./secrets/mqtt_username:/run/secrets/mqtt_username:ro
      - ./secrets/mqtt_password:/run/secrets/mqtt_password:ro
      - ./secrets/sevdesk_api_token:/run/secrets/sevdesk_api_token:ro
      - ./secrets/finance_tax_reserve_eur:/run/secrets/finance_tax_reserve_eur:ro
      - ./secrets/finance_operating_buffer_eur:/run/secrets/finance_operating_buffer_eur:ro
    networks:
      - ins-platform

  ins-ei-frontend:
    build: ./frontend
    container_name: ins-ei-frontend
    restart: unless-stopped
    ports:
      - "10.10.0.20:8080:80"
    depends_on:
      - ins-ei-api
    networks:
      - ins-platform

volumes:
  ins_ei_data:
    external: true
    name: ins-ei_ins_ei_data

networks:
  ins-platform:
    external: true
